{% extends "base.html" %}

{% block header_title %}
  <a href="{% url 'tenant_detail' tenant.id %}" style="color: var(--text-dim); text-decoration: none; margin-right: 8px;"><i class="bi bi-arrow-left"></i></a>
  Hariri: {{ tenant.name }}
{% endblock %}

{% block content %}
<div style="max-width: 720px; margin: 0 auto;">
  <div class="stat-card" style="padding: 32px;">
    <h2 style="font-size: 20px; font-weight: 800; color: white; margin-bottom: 24px;">Hariri Taarifa za Mteja</h2>

    <form method="POST">
      {% csrf_token %}
      
      <div class="form-group">
        <label class="form-label">Jina la Taasisi / Mteja</label>
        <input type="text" name="name" class="form-control" value="{{ tenant.name }}" required>
      </div>

      <div class="form-group">
        <label class="form-label">Mfumo Anao-tumia</label>
        <select name="app_id" class="form-control" required>
          {% for app in apps %}
            <option value="{{ app.id }}" {% if app.id == tenant.app.id %}selected{% endif %}>{{ app.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
        <div class="form-group">
          <label class="form-label">Namba ya Simu</label>
          <input type="text" name="phone" class="form-control" value="{{ tenant.phone }}" required>
        </div>

        <div class="form-group">
          <label class="form-label">Barua Pepe (Email)</label>
          <input type="email" name="email" class="form-control" value="{{ tenant.email }}" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Link / Tovuti ya Mfumo Wao (URL)</label>
        <input type="url" name="system_url" class="form-control" value="{{ tenant.system_url|default:'' }}" placeholder="https://kanisa.usherika.org au https://pos.baraka.co.tz">
        <span style="font-size: 11px; color: var(--text-dim); margin-top: 4px; display: block;">Link hii itatumwa pia kwenye email ya mteja ili aingie kwa urahisi akishalipia.</span>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
        <div class="form-group">
          <label class="form-label">Mtu wa Mawasiliano</label>
          <input type="text" name="contact_person" class="form-control" value="{{ tenant.contact_person }}">
        </div>

        <div class="form-group">
          <label class="form-label">Ada ya Mwezi (TZS)</label>
          <input type="number" name="monthly_rate_tzs" class="form-control" value="{{ tenant.monthly_rate_tzs }}" required>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
        <div class="form-group">
          <label class="form-label">Tarehe ya Kuisha (Expiry Date)</label>
          <input type="date" name="subscription_end" class="form-control" value="{{ tenant.subscription_end|date:'Y-m-d' }}" required>
        </div>

        <div class="form-group">
          <label class="form-label">Hali ya Leseni</label>
          <select name="status" class="form-control">
            <option value="ACTIVE" {% if tenant.status == 'ACTIVE' %}selected{% endif %}>ACTIVE (Hai)</option>
            <option value="EXPIRING_SOON" {% if tenant.status == 'EXPIRING_SOON' %}selected{% endif %}>EXPIRING_SOON (Inakaribia Kuisha)</option>
            <option value="GRACE_PERIOD" {% if tenant.status == 'GRACE_PERIOD' %}selected{% endif %}>GRACE_PERIOD (Nyongeza)</option>
            <option value="EXPIRED" {% if tenant.status == 'EXPIRED' %}selected{% endif %}>EXPIRED (Imeisha)</option>
            <option value="SUSPENDED" {% if tenant.status == 'SUSPENDED' %}selected{% endif %}>SUSPENDED (Imezimwa na Admin)</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Maelezo (Notes)</label>
        <textarea name="notes" rows="3" class="form-control">{{ tenant.notes }}</textarea>
      </div>

      <div style="margin-top: 28px; display: flex; justify-content: flex-end; gap: 12px;">
        <a href="{% url 'tenant_detail' tenant.id %}" class="btn btn-secondary">Ghairi</a>
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-save"></i> Sasisha Mabadiliko
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
