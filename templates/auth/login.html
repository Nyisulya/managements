<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingia &bull; Mifumo Yangu Billing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 50% 20%, #172554, #080d1a 60%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(16px);
      border: 1px solid #1e2e4a;
      border-radius: 24px;
      max-width: 420px;
      width: 100%;
      padding: 36px 32px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7);
    }
    .brand-icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      color: white;
      margin: 0 auto 16px;
      box-shadow: 0 8px 20px rgba(37,99,235,0.4);
    }
    .title {
      text-align: center;
      font-size: 22px;
      font-weight: 800;
      color: white;
      margin-bottom: 6px;
    }
    .subtitle {
      text-align: center;
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 28px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 8px;
    }
    .input-wrapper {
      position: relative;
    }
    .input-wrapper i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 16px;
    }
    .form-input {
      width: 100%;
      background: #080d1a;
      border: 1px solid #1e2e4a;
      border-radius: 12px;
      padding: 13px 14px 13px 42px;
      color: white;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }
    .form-input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
    }
    .btn-login {
      width: 100%;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 14px rgba(37,99,235,0.4);
      transition: all 0.2s;
    }
    .btn-login:hover {
      background: linear-gradient(135deg, #1d4ed8, #1e40af);
      transform: translateY(-1px);
    }
    .alert-box {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 20px;
      text-align: center;
    }
    .badge-features {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #1e2e4a;
      display: flex;
      justify-content: center;
      gap: 16px;
      font-size: 11px;
      color: #64748b;
    }
    .badge-features span {
      display: flex;
      align-items: center;
      gap: 5px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand-icon">
      <i class="bi bi-shield-lock-fill"></i>
    </div>
    <h1 class="title">Felician</h1>
    <p class="subtitle">Usimamizi wa Mifumo, Leseni & Malipo Kiotomatiki</p>

    {% if messages %}
      {% for msg in messages %}
        <div class="alert-box">{{ msg }}</div>
      {% endfor %}
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Jina la Mtumiaji (Username)</label>
        <div class="input-wrapper">
          <i class="bi bi-person"></i>
          <input type="text" name="username" class="form-input" placeholder="admin" required autofocus>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Nenosiri (Password)</label>
        <div class="input-wrapper">
          <i class="bi bi-key"></i>
          <input type="password" name="password" class="form-input" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn-login">
        Ingia Kwenye Dashboard &rarr;
      </button>
    </form>

    <div class="badge-features">
      <span><i class="bi bi-check2-circle" style="color: #10b981;"></i> HarakaPay</span>
      <span><i class="bi bi-check2-circle" style="color: #3b82f6;"></i> Resend API</span>
      <span><i class="bi bi-check2-circle" style="color: #f59e0b;"></i> Auto Lock</span>
    </div>
  </div>
</body>
</html>
